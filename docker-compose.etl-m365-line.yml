services:
  etl-m365-line:
    build: ./services/etl-m365-line
    image: etl-m365-line:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data-output/model-cache:/root/.cache/huggingface/hub
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=appdb
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - BATCH_SIZE=64
      - CRON_SCHEDULE=0 * * * *
