AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Creates an IAM role assumed by GitHub Actions via OIDC and an IAM OIDC provider
  for token.actions.githubusercontent.com. The role is granted minimal permissions
  to read a Secrets Manager secret and perform ECR actions used by CI.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or user (e.g. my-org)
  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g. my-repo)
  GitHubBranch:
    Type: String
    Description: Branch name that is allowed to assume the role (e.g. main)
  RoleName:
    Type: String
    Default: ci-github-oidc-role
    Description: Name for the IAM role to create
  DBSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing DB credentials
  ECRResourceArn:
    Type: String
    Default: '*'
    Description: ARN for ECR resources the role can access (default: '*')

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  CICDRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # limit subject to the specific repo and branch
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: CIInlinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref DBSecretArn
              - Sid: ECRActions
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                Resource:
                  - !Ref ECRResourceArn

Outputs:
  RoleArn:
    Description: ARN of the created IAM role
    Value: !GetAtt CICDRole.Arn
  OIDCProviderArn:
    Description: ARN of the created OIDC provider
    Value: !Ref GitHubOIDCProvider
